<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --earth:      #0d0a06;
    --earth-mid:  #1a0e04;
    --earth-deep: #2C1A0A;
    --gold:       #C8922A;
    --gold-light: #E8A838;
    --gold-pale:  #F5D98B;
    --cream:      #D4C4A0;
    --rust:       #8B3A1A;
    --muted:      #5A4030;
    --border:     rgba(200,146,42,0.18);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--earth);
    color: var(--gold-pale);
    font-family: 'Lora', serif;
    overflow: hidden;
  }

  /* ---- GRAIN OVERLAY ---- */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    opacity: 0.6;
  }

  /* ---- AMBIENT GLOW ---- */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 30%, rgba(200,146,42,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 80%, rgba(139,58,26,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(200,146,42,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ---- LAYOUT ---- */
  .stage {
    position: relative; z-index: 1;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 40px 24px;
  }

  /* ---- RULE LINES ---- */
  .rule {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    opacity: 0.3;
    margin: 12px 0;
    animation: pulseRule 3s ease-in-out infinite;
  }

  @keyframes pulseRule {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.5; }
  }

  /* ---- PAW MARK ---- */
  .paw-wrap {
    animation: floatPaw 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 32px rgba(200,146,42,0.35));
    margin-bottom: 4px;
  }

  @keyframes floatPaw {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  /* ---- WORDMARK ---- */
  .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(42px, 7vw, 80px);
    color: var(--gold-pale);
    letter-spacing: -2px;
    line-height: 1;
    text-align: center;
    animation: fadeUp 0.8s ease both;
  }

  .wordmark span { color: var(--gold); }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    text-align: center;
    margin-top: 8px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .tagline {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: clamp(13px, 1.4vw, 16px);
    color: var(--cream);
    opacity: 0.5;
    text-align: center;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  /* ---- LAUNCH BUTTON ---- */
  .launch-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    background: transparent;
    border: 1px solid rgba(200,146,42,0.35);
    border-radius: 6px;
    padding: 18px 40px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    transition: all 0.3s ease;
    overflow: hidden;
    animation: fadeUp 0.8s 0.4s ease both;
    text-decoration: none;
  }

  .launch-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(200,146,42,0.1), rgba(200,146,42,0.03));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .launch-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: -100%; right: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transition: left 0.4s ease, right 0.4s ease;
  }

  .launch-btn:hover {
    border-color: rgba(200,146,42,0.7);
    color: var(--gold-pale);
    box-shadow: 0 0 40px rgba(200,146,42,0.15), inset 0 0 30px rgba(200,146,42,0.04);
    transform: translateY(-2px);
  }

  .launch-btn:hover::before { opacity: 1; }
  .launch-btn:hover::after { left: 0; right: 0; }

  .launch-btn:active { transform: translateY(0); }

  .btn-icon {
    font-size: 20px;
    transition: transform 0.3s;
  }

  .launch-btn:hover .btn-icon { transform: scale(1.15); }

  /* ---- QUICK LINKS ---- */
  .quick-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.8s 0.5s ease both;
    margin-top: 4px;
  }

  .quick-link {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(44,26,10,0.4);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 14px;
    text-decoration: none;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.2s;
  }

  .quick-link:hover {
    background: rgba(200,146,42,0.08);
    border-color: rgba(200,146,42,0.3);
    color: var(--gold);
    transform: translateY(-1px);
  }

  /* ---- STATS ROW ---- */
  .stats-row {
    display: flex;
    gap: 32px;
    animation: fadeUp 0.8s 0.6s ease both;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }

  .stat-lbl {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .stat-div {
    width: 1px;
    height: 32px;
    background: var(--border);
    align-self: center;
  }

<script>
  // The hub iframe overlay
  function launchHub() {
    // Create fullscreen overlay
    const overlay = document.createElement('div');
    overlay.id = 'hub-overlay';
    overlay.style.cssText = `
      position: fixed; inset: 0; z-index: 1000;
      background: #0d0a06;
      display: flex; flex-direction: column;
      animation: overlayIn 0.3s ease;
    `;

    // Top bar with close
    const bar = document.createElement('div');
    bar.style.cssText = `
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(44,26,10,0.95);
      border-bottom: 1px solid rgba(200,146,42,0.15);
      flex-shrink: 0;
    `;

    const barLeft = document.createElement('div');
    barLeft.style.cssText = `display:flex; align-items:center; gap:10px;`;
    barLeft.innerHTML = `
      <svg viewBox="0 0 120 120" width="20" height="20" fill="none">
        <ellipse cx="60" cy="72" rx="28" ry="26" fill="#C8922A"/>
        <ellipse cx="35" cy="48" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="52" cy="40" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="70" cy="40" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="87" cy="48" rx="10" ry="11" fill="#C8922A"/>
      </svg>
      <span style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:3px; color:#C8922A; text-transform:uppercase;">Muddy Paw Command Center</span>
    `;

    const closeBtn = document.createElement('button');
    closeBtn.textContent = '✕ Close';
    closeBtn.style.cssText = `
      background: transparent;
      border: 1px solid rgba(200,146,42,0.2);
      color: #5A4030;
      padding: 5px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s;
    `;
    closeBtn.onmouseover = () => { closeBtn.style.color = '#C8922A'; closeBtn.style.borderColor = 'rgba(200,146,42,0.5)'; };
    closeBtn.onmouseout = () => { closeBtn.style.color = '#5A4030'; closeBtn.style.borderColor = 'rgba(200,146,42,0.2)'; };
    closeBtn.onclick = () => {
      overlay.style.animation = 'overlayOut 0.25s ease forwards';
      setTimeout(() => overlay.remove(), 250);
    };

    bar.appendChild(barLeft);
    bar.appendChild(closeBtn);

    // Message area — instructions since hub is a React artifact
    const content = document.createElement('div');
    content.style.cssText = `
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 20px;
    `;

    content.innerHTML = `
      <svg viewBox="0 0 120 120" width="56" height="56" fill="none">
        <ellipse cx="60" cy="72" rx="28" ry="26" fill="#C8922A"/>
        <ellipse cx="35" cy="48" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="52" cy="40" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="70" cy="40" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="87" cy="48" rx="10" ry="11" fill="#C8922A"/>
        <ellipse cx="52" cy="64" rx="10" ry="8" fill="#E8A838" opacity="0.35"/>

        Open the Hub artifact from your Claude conversation to access the full Command Center with PIN lock, inventory, platforms, and listing board.
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:480px; width:100%; margin-top:8px;">
        ${[
          ['🛒','eBay','https://signin.ebay.com'],
          ['📘','Facebook','https://facebook.com'],
          ['📋','Craigslist','https://accounts.craigslist.org'],
          ['🍺','ProBrewer','https://probrewer.com/login'],
          ['⚙️','Machinio','https://machinio.com/login'],
          ['🏛','GovDeals','https://www.govdeals.com/login'],
        ].map(([icon,name,url]) => `
          <a href="${url}" target="_blank" style="
            display:flex; align-items:center; gap:10px;
            background:rgba(44,26,10,0.5);
            border:1px solid rgba(200,146,42,0.15);

            font-family:'DM Mono',monospace; font-size:11px;
            letter-spacing:1px; text-transform:uppercase;
            transition:all 0.2s;
          "
          onmouseover="this.style.borderColor='rgba(200,146,42,0.4)';this.style.color='#F5D98B'"
          onmouseout="this.style.borderColor='rgba(200,146,42,0.15)';this.style.color='#D4C4A0'"

            <span style="font-size:16px">${icon}</span> ${name}

        `).join('')}

      <div style="margin-top:12px; font-family:'DM Mono',monospace; font-size:10px; color:#3A2818; letter-spacing:1px;">
        (509) 906-2938 · muddypawtrading@gmail.com

    `;

    overlay.appendChild(bar);
    overlay.appendChild(content);
    document.body.appendChild(overlay);
  }

  // Keyboard shortcut — Cmd/Ctrl + Enter to launch
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') launchHub();
    if (e.key === 'Escape') {
      const overlay = document.getElementById('hub-overlay');
      if (overlay) overlay.remove();
    }
  });
</script>

    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.98); }
  }
